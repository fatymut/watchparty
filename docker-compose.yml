services:
  mysql:
    image: mysql:8.4
    container_name: watchparty_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: watchparty_db
      MYSQL_USER: watchparty_user
      MYSQL_PASSWORD: watchparty_password
    ports:
      - "3306:3306"
    volumes:
      - watchparty_mysql_data:/var/lib/mysql

volumes:
  watchparty_mysql_data: